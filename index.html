<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Fcous</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="One tap and then.. fcous. No timers. No stats. Just the shift.">
    <meta property="og:title" content="Get Fcous">
    <meta property="og:description" content="One tap and then.. fcous.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://get-focus.app">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            overflow-x: hidden;
        }

        .container {
            max-width: 520px;
            width: 100%;
            text-align: center;
        }

        /* Animated orb - much more dynamic */
        .orb-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
        }

        .orb {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%,
                rgba(255, 200, 140, 1) 0%,
                rgba(255, 160, 80, 0.9) 25%,
                rgba(220, 120, 60, 0.8) 50%,
                rgba(180, 80, 40, 0.5) 75%,
                transparent 100%);
            animation: orbPulse 3s ease-in-out infinite;
            box-shadow:
                0 0 60px rgba(255, 150, 80, 0.4),
                0 0 120px rgba(255, 120, 60, 0.2),
                inset 0 0 40px rgba(255, 180, 100, 0.3);
        }

        .orb-glow {
            position: absolute;
            inset: -40px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(255, 160, 80, 0.4) 0%,
                rgba(255, 120, 60, 0.2) 40%,
                transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
            filter: blur(30px);
        }

        .orb-ring {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 180, 100, 0.4);
            animation: ringPulse 3s ease-in-out infinite;
        }

        .orb-ring-outer {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            border: 1px solid rgba(255, 180, 100, 0.15);
            animation: ringOuterPulse 3s ease-in-out infinite;
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 180, 120, 0.6);
            border-radius: 50%;
            filter: blur(1px);
        }

        .particle:nth-child(1) {
            top: 10%;
            left: 20%;
            animation: float1 4s ease-in-out infinite;
        }

        .particle:nth-child(2) {
            top: 80%;
            left: 70%;
            animation: float2 5s ease-in-out infinite;
        }

        .particle:nth-child(3) {
            top: 30%;
            right: 10%;
            animation: float3 4.5s ease-in-out infinite;
        }

        @keyframes orbPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow:
                    0 0 60px rgba(255, 150, 80, 0.4),
                    0 0 120px rgba(255, 120, 60, 0.2),
                    inset 0 0 40px rgba(255, 180, 100, 0.3);
            }
            50% {
                transform: scale(1.08);
                box-shadow:
                    0 0 80px rgba(255, 150, 80, 0.5),
                    0 0 160px rgba(255, 120, 60, 0.3),
                    inset 0 0 50px rgba(255, 180, 100, 0.4);
            }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.15); }
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        @keyframes ringOuterPulse {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.12); opacity: 0.3; }
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            50% { transform: translate(10px, -15px) scale(1.2); opacity: 1; }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
            50% { transform: translate(-12px, -10px) scale(1.3); opacity: 0.9; }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            50% { transform: translate(-8px, 12px) scale(1.1); opacity: 0.8; }
        }

        /* App name - THE HERO */
        .app-name {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(36px, 10vw, 58px);
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(255, 191, 115, 1);
            margin-bottom: 32px;
            text-shadow: 0 0 40px rgba(255, 170, 80, 0.3);
        }

        /* Tagline - artistic handwritten style */
        .tagline {
            font-family: 'Caveat', cursive;
            font-size: clamp(26px, 6vw, 34px);
            font-weight: 500;
            line-height: 1.3;
            margin-bottom: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .tagline .highlight {
            color: rgba(255, 191, 115, 0.95);
            font-weight: 600;
            position: relative;
        }

        .tagline .highlight::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 191, 115, 0.6), transparent);
            animation: underlineGlow 3s ease-in-out infinite;
        }

        @keyframes underlineGlow {
            0%, 100% { opacity: 0.4; transform: scaleX(0.8); }
            50% { opacity: 1; transform: scaleX(1); }
        }

        /* Subtitle */
        .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 48px;
            letter-spacing: 0.5px;
        }

        /* Store buttons */
        .store-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .store-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 200px;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .store-btn.ios {
            background: #ffffff;
            color: #000000;
        }

        .store-btn.ios:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .store-btn.android {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: default;
        }

        .store-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .store-btn.android svg {
            opacity: 0.5;
        }

        .btn-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .btn-text .small {
            font-size: 9px;
            font-weight: 400;
            opacity: 0.7;
        }

        .btn-text .main {
            font-size: 14px;
            font-weight: 600;
        }

        /* Mobile adjustments */
        @media (max-width: 400px) {
            .orb-container {
                width: 160px;
                height: 160px;
                margin-bottom: 32px;
            }

            .app-name {
                letter-spacing: 5px;
            }

            .store-btn {
                padding: 10px 16px;
            }
        }

        @media (min-width: 500px) {
            .store-buttons {
                flex-direction: row;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="orb-container">
            <div class="orb-glow"></div>
            <div class="orb-ring-outer"></div>
            <div class="orb-ring"></div>
            <div class="orb"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="app-name">Get Fcous</div>

        <p class="tagline">one tap.. <span class="highlight">Fcous.</span></p>

        <p class="subtitle">No timers. No stats. Just the shift.</p>

        <div class="store-buttons">
            <a href="https://apps.apple.com/us/app/get-fcous/id6758585443" class="store-btn ios" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
                <span class="btn-text">
                    <span class="small">Download on the</span>
                    <span class="main">App Store</span>
                </span>
            </a>

            <div class="store-btn android">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.523 2.293a.5.5 0 0 0-.67.223l-1.443 2.888A8.993 8.993 0 0 0 12 4.5c-1.2 0-2.35.234-3.41.904L7.147 2.516a.5.5 0 1 0-.894.448l1.416 2.832A9.027 9.027 0 0 0 3 13.5h18a9.027 9.027 0 0 0-4.67-7.704l1.416-2.832a.5.5 0 0 0-.223-.67zM8.5 11a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm7 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zM3 14.5v5A2.5 2.5 0 0 0 5.5 22h13a2.5 2.5 0 0 0 2.5-2.5v-5H3z"/>
                </svg>
                <span class="btn-text">
                    <span class="small">Coming soon on</span>
                    <span class="main">Google Play</span>
                </span>
            </div>
        </div>
    </div>
</body>
</html>
